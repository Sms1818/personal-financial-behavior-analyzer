spring:
  application:
    name: personal-financial-behavior-analyzer

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  address: 0.0.0.0
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    
  endpoint:
    health:
      show-details: always

llm:
  gemini:
    api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000


