spring:
  application:
    name: personal-financial-behavior-analyzer

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

llm:
  gemini:
    api-key: ${GEMINI_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
